services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: localroot
      MYSQL_DATABASE: memberconnect
      MYSQL_USER: memberconnect
      MYSQL_PASSWORD: memberconnect
    ports: ["3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocalroot"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  spring:
    build: ./spring-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/memberconnect?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: memberconnect
      SPRING_DATASOURCE_PASSWORD: memberconnect
      SERVER_PORT: 8080
    ports: ["8080:8080"]
    depends_on:
      mysql:
        condition: service_healthy
  bff:
    build: ./bff
    environment:
      PORT: 3001
      SPRING_API_URL: http://spring:8080
      REDIS_URL: redis://redis:6379
      DEMO_BEARER_TOKEN: local-demo-token
    ports: ["3001:3001"]
    depends_on: [spring, redis]
  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE: http://localhost:3001
    ports: ["5173:5173"]
    depends_on: [bff]
volumes:
  mysql-data:
