openapi: 3.0.3
info:
  title: MemberConnect API
  version: 1.0.0
  description: Demo membership benefits and offer discovery API.
servers:
  - url: http://localhost:3001
paths:
  /health:
    get:
      summary: BFF health check
      responses:
        '200': {description: Service health}
  /api/offers:
    get:
      summary: List eligible offers
      parameters:
        - in: query
          name: customerId
          schema: {type: string, default: customer-1}
      responses:
        '200': {description: Eligible offers}
  /api/offers/recommended:
    get:
      summary: Get recommended offers
      parameters:
        - in: query
          name: customerId
          schema: {type: string, default: customer-1}
      responses:
        '200': {description: Recommended offers}
  /api/offers/{id}:
    get:
      summary: Get offer details
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer}
      responses:
        '200': {description: Offer details}
        '404': {description: Offer not found}
  /api/offers/{id}/redeem:
    post:
      summary: Redeem an eligible offer
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer}
        - in: query
          name: customerId
          schema: {type: string, default: customer-1}
      responses:
        '200': {description: Redeemed}
        '403': {description: Not eligible}
        '409': {description: Already redeemed}
  /api/benefits:
    get:
      summary: List membership benefits
      responses:
        '200': {description: Benefits catalogue}
  /api/benefits/{id}:
    get:
      summary: Get benefit details
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer}
      responses:
        '200': {description: Benefit details}
        '404': {description: Benefit not found}
  /api/customers/{customerId}/redemptions:
    get:
      summary: Get customer redemption history
      parameters:
        - in: path
          name: customerId
          required: true
          schema: {type: string}
      responses:
        '200': {description: Redemption history}
