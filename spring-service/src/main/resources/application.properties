spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/memberconnect?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:memberconnect}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:memberconnect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
server.port=${SERVER_PORT:8080}
